[project]
name = "ableton-claude"
version = "1.0.0"
description = "MCP server that drives Ableton Live through the ClaudeBridge Remote Script"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "imageio-ffmpeg==0.6.0",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
ableton-claude-mcp = "ableton_claude.server:main"

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller==6.22.0"]
ear = [
    "beat-this",
    "demucs>=4.0.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ableton_claude"]

[tool.uv.sources]
beat-this = { url = "https://github.com/CPJKU/beat_this/archive/main.zip" }

[tool.uv]
default-groups = ["dev", "ear"]
