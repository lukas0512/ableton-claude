[project]
name = "ableton-claude"
version = "0.1.0"
description = "MCP server that drives Ableton Live through the ClaudeBridge Remote Script"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]

[project.scripts]
ableton-claude-mcp = "ableton_claude.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ableton_claude"]
